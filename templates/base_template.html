<!DOCTYPE html>
<html lang=lang>
<head>
    <meta charset="utf-8">
    <title>{{ title }}</title>
    <link rel="icon" type="image/jpg" href="{{ url_for('static', filename='favicon.jpg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/buttons.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/header.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <header>
        <form method="post">
            <h1>{{ title }}</h1>
            <button type="submit" name="btn" class="authorization_btn" value="autho">{{ autho_btn_text }}</button>
            <button type="submit" name="btn" class="change_lang_btn" value="change_lang">{{ change_lang_btn_text }}</button>
            {% if type > 0 %}
                <button type="submit" name="btn" class="to_main_btn" value="to_main">{{ to_main_btn_text }}</button>
            {% endif %}
            {% if type > 1 %}
                <button type="submit" name="btn" class="to_game_btn" value="to_game">{{ to_game_btn_text }}</button>
            {% endif %}
        </form>
    </header>
    <main role="main" class="container">
        {% block content %}{% endblock %}
    </main>
    <div>
        <p>{{ tech_info }}</p>
    </div>
</body>
